<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirror</title><style>:root { --ds-page:#fdfcfa; --ds-ink:#3b2a28; --ds-ink-2:#7a6c68; --ds-hairline:#ddd5d0; }
html,body{margin:0;background:var(--ds-page);color:var(--ds-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;-webkit-text-size-adjust:100%}
.sa-wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.sa-head h1{margin:0 0 4px;font-size:34px}.sa-fact,.sa-intro{margin:4px 0;color:var(--ds-ink-2)}
.file-button{font:inherit;font-size:16px;padding:12px 18px;border-radius:10px;border:1px solid var(--ds-ink);background:var(--ds-ink);color:#fff;cursor:pointer}
.file-button[data-variant="secondary"]{background:transparent;color:var(--ds-ink);border-color:var(--ds-hairline)}
.file-button.is-compact{padding:8px 12px;font-size:14px}
.file-button:disabled{opacity:.45;cursor:default}
html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.mir-col { display: flex; flex-direction: column; gap: 14px; font-family: inherit; }
.mir-row { display: flex; gap: 8px; }
.mir-input { flex: 1; min-width: 0; padding: 12px; font-size: 16px; border: 1px solid var(--ds-hairline); border-radius: 10px; background: transparent; color: var(--ds-ink); }
.mir-note { color: var(--ds-ink-2); margin: 0; font-size: 14px; }
.mir-err { color: #b3261e; margin: 0; font-size: 14px; }
.mir-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.mir-list li { padding: 10px 12px; border: 1px solid var(--ds-hairline); border-radius: 10px; }
.mir-others { display: flex; flex-direction: column; gap: 10px; }
.mir-player { padding: 10px; border: 1px solid var(--ds-hairline); border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
.mir-turn { border-color: var(--ds-ink); box-shadow: inset 0 0 0 1px var(--ds-ink); }
.mir-me { background: rgba(0, 0, 0, 0.03); }
.mir-pname { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mir-pname small { color: var(--ds-ink-2); }
.mir-hand { display: flex; flex-wrap: wrap; gap: 8px; }
.mir-card { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 74px; border-radius: 8px; border: 1px solid #888; background: #fff; color: #111; font-size: 18px; padding: 0; line-height: 1.1; font-family: inherit; }
.mir-card b { font-size: 20px; } .mir-card i { font-style: normal; font-size: 20px; }
.mir-red { color: #c62828; }
.mir-back { background: repeating-linear-gradient(45deg, #2b3a67, #2b3a67 6px, #3d4f8a 6px, #3d4f8a 12px); color: #fff; border-color: #1b2547; }
.mir-empty { border-style: dashed; background: transparent; }
.mir-small { width: 34px; height: 48px; font-size: 13px; } .mir-small b, .mir-small i { font-size: 13px; }
.mir-card:disabled { opacity: 1; cursor: default; }
.mir-sel { outline: 3px solid #f2a900; cursor: pointer; }
.mir-first { outline: 3px solid #1a7f37; }
.mir-card em { position: absolute; top: -6px; inset-inline-end: -6px; font-style: normal; font-size: 14px; }
.mir-center { display: flex; gap: 22px; justify-content: center; align-items: flex-end; padding: 8px 0; }
.mir-discard { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mir-discard small { color: var(--ds-ink-2); font-size: 12px; }
.mir-deck b { background: rgba(0, 0, 0, 0.5); border-radius: 6px; padding: 2px 8px; font-size: 16px; }
.mir-hint { margin: 0; text-align: center; font-weight: 600; min-height: 1.4em; }
.mir-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.mir-log { list-style: none; padding: 0; margin: 0; color: var(--ds-ink-2); font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.mir-results { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--ds-ink); border-radius: 12px; }
.mir-results h3 { margin: 0; font-size: 16px; }
.mir-res { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 8px; border-radius: 8px; border: 1px solid var(--ds-hairline); }
.mir-win { background: rgba(26, 127, 55, 0.1); }
.mir-reshand { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.mir-rules ul { padding-inline-start: 18px; font-size: 14px; line-height: 1.6; color: var(--ds-ink-2); }
.mir-overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; }
.mir-modal { background: var(--ds-page, #fff); color: var(--ds-ink); padding: 22px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mir-modal .mir-card { width: 96px; height: 136px; } .mir-modal .mir-card b, .mir-modal .mir-card i { font-size: 38px; }
@keyframes mir-pop { from { transform: scale(0.55) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes mir-drop { from { transform: translateY(-26px) scale(1.15); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes mir-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.0); } 50% { box-shadow: 0 0 0 7px rgba(255, 170, 0, 0.55); } }
@keyframes mir-flip { from { transform: rotateY(90deg); } to { transform: none; } }
@keyframes mir-tick { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.mir-pop { animation: mir-pop 0.45s ease-out; }
.mir-drop { animation: mir-drop 0.4s ease-out; }
.mir-hl { animation: mir-glow 1s ease-in-out infinite; outline: 3px solid #f2a900; z-index: 1; }
.mir-hl-give { outline-color: #1a7f37; }
.mir-hl-look { outline-color: #1f6feb; }
.mir-hl-swap { outline-color: #e8590c; }
.mir-throw { outline: 3px dashed #c62828; cursor: pointer; }
.mir-timer { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 84px; padding: 8px 12px; border-radius: 16px; background: var(--ds-ink, #3b2a28); color: #fff; }
.mir-timer b { font-size: 56px; line-height: 1; animation: mir-tick 1s ease-out infinite; }
.mir-timer small { font-size: 12px; max-width: 120px; text-align: center; }
.mir-modal .mir-card { animation: mir-flip 0.4s ease-out; }
@media (max-width: 420px) { .mir-center { gap: 12px; flex-wrap: wrap; } }
.mir-hl.mir-throw { outline-style: solid; outline-width: 4px; }
.mir-peekbox { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border-radius: 14px; border: 2px solid #1f6feb; background: rgba(31, 111, 235, 0.08); }
.mir-peekbox small { max-width: 110px; text-align: center; }
.mir-peekbox .mir-card { width: 64px; height: 92px; animation: mir-flip 0.4s ease-out; }
